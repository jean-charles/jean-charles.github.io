title: JC
description: My personal page
baseurl: ""
url: "https://jean-charles.github.io" 
#google_analytics: UA-000000000-0
timezone: Canada/Montréal
show_excerpts: true # Show excerpts of posts on the home page
permalink: /:categories/:title # Don't show the date of the post in the URL

# Social
#twitter_username: nathandench
github_username: jean-charles
#linkedin_username: nathandench

# Build settings
markdown: kramdown
theme: minimal-mistakes
remote_theme: mmistakes/minimal-mistakes@4.28.1
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-remote-theme

defaults:
  - scope:
      path: _posts
    values:
      layout: post
  - scope:
      path: "README.md"
    values:
      permalink: "index.html"
